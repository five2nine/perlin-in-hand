[project]
name = "terrain-noise-workbench-2026"
version = "0.1.0"
description = "CPU/GPU procedural terrain and noise workbench"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "perlin>=0.0.2",
    "numpy>=1.26.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.67.3",
    "moderngl>=5.12.0",
    "glcontext>=3.0.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "moderngl-window>=3.1.1",
    "opensimplex>=0.4.5.1",
    "pygame-ce>=2.5.7",
]

[project.optional-dependencies]
# pyimgui 2.0.0 currently fails to build on Python 3.13+ on Windows.
# Keep ImGui-based tools as a legacy optional extra until upstream supports
# the current Python line used by the default environment.
imgui-legacy = [
    "imgui>=2.0.0",
]
